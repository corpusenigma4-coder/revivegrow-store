# Envoie UNE demande d'activation FormSubmit vers corpusenigma4@gmail.com
# (autorisée par la propriétaire de la boutique). Il suffit ensuite de cliquer
# « Activate Form » dans l'e-mail reçu pour recevoir les coordonnées des clients.
name: Activer la réception des commandes par e-mail
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/activer-reception-commandes.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  activer:
    runs-on: ubuntu-latest
    steps:
      - name: Demande d'activation FormSubmit
        run: |
          curl -sS -X POST "https://formsubmit.co/ajax/corpusenigma4@gmail.com" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -H "Origin: https://revivegrow.store" -H "Referer: https://revivegrow.store/commande/" \
            -d '{"_subject":"REVIVE GROW — activation de la réception des commandes","_template":"table","Message":"Activation : cliquez sur « Activate Form » pour recevoir les coordonnées de livraison de vos clients."}'

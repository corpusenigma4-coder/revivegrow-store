name: REVIVE GROW — Qualité
on:
  push:
    branches: [main, 'claude/**', 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    name: Tests unitaires, build et navigateur
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tests unitaires (campagne, formats)
        run: npm run test:unit
      - name: Build de production
        run: npm run build
      - name: Navigateur Chromium
        run: npx playwright install --with-deps chromium
      - name: Tests navigateur + captures
        run: npm run test:e2e
      - name: Rapport avant lancement (informatif en phase 1)
        run: npm run check:launch || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-revivegrow
          path: screenshots/
          if-no-files-found: ignore

name: REVIVE GROW — Calidad
on:
  push:
    branches: [main, 'claude/**', 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    name: Pruebas unitarias, build y navegador
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias (cálculos, pedidos, servidor)
        run: npm run test:unit
      - name: Build de producción
        run: npm run build
      - name: Navegador Chromium
        run: npx playwright install --with-deps chromium
      - name: Pruebas de navegador + capturas
        run: npm run test:e2e
      - name: Pendientes antes del lanzamiento (informativo)
        run: npm run check:launch || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-revivegrow
          path: screenshots/
          if-no-files-found: ignore

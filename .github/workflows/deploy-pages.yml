# Publication sur GitHub Pages (revivegrow.store).
# Publication automatique à chaque push sur main (et manuellement depuis l'onglet Actions).
# Prérequis (une seule fois) : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Publier sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - name: Vérifier la présence du domaine personnalisé
        run: test "$(cat dist/CNAME)" = "revivegrow.store"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Attendre la propagation
        run: sleep 45
      - name: Vérifier le site publié et le bouton PayPal
        run: node tests/e2e/live-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-site-en-ligne
          path: screenshots/
          if-no-files-found: ignore

# Publication sur GitHub Pages (revivegrow.store).
# Publication automatique à chaque push sur main (et manuellement depuis l'onglet Actions).
# Prérequis (une seule fois) : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Publier sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - name: Vérifier la présence du domaine personnalisé
        run: test "$(cat dist/CNAME)" = "revivegrow.store"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Rafraîchir la source Pages si l'API l'autorise
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          code=$(curl -sS -L -X PUT -o /tmp/pages-refresh -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"build_type":"workflow"}' \
            "https://api.github.com/repos/corpusenigma4-coder/revivegrow-store/pages")
          echo "Rafraîchissement Pages HTTP $code"
          case "$code" in
            200|204) echo 'Configuration GitHub Actions reconfirmée.' ;;
            403) echo 'L’API exige les droits administrateur du propriétaire; réglage manuel nécessaire.' ;;
            *) cat /tmp/pages-refresh; echo 'La configuration existante reste inchangée.' ;;
          esac
      - name: Débloquer le déploiement Pages précédent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Déploiement confirmé bloqué par GitHub (ID remonté dans le run #6).
          stale=bc7d8c8e426d80f3532acbc84b2838e6521a3dc7
          code=$(curl -sS -L -X POST -o /tmp/pages-cancel-response -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/corpusenigma4-coder/revivegrow-store/pages/deployments/$stale/cancel")
          echo "Ancien déploiement Pages, annulation HTTP $code"
          case "$code" in
            204) sleep 5 ;;
            400)
              if grep -q "as it's finished" /tmp/pages-cancel-response; then
                echo 'Ancien déploiement déjà terminé.'
              else
                cat /tmp/pages-cancel-response
                exit 1
              fi
              ;;
            404|409) echo 'Ancien déploiement déjà terminé ou absent.' ;;
            *) cat /tmp/pages-cancel-response; exit 1 ;;
          esac
      - id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Attendre la propagation
        run: sleep 45
      - name: Vérifier le site publié et le bouton PayPal
        run: node tests/e2e/live-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-site-en-ligne
          path: screenshots/
          if-no-files-found: ignore
